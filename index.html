<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpiShop — E-commerce</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

  <header class="bg-primary text-white py-3">
    <div class=" container d-flex justify-content-between align-items-center">
      <h1 class="fs-3-m-0">EpiShop</h1>
      <nav>
        <a href="0" class="text-white text-decoration-none">Prodotti</a>
        <a href="1" class="text-white text-decoration-none">Offerte</a>
        <a href="2" class="text-white text-decoration-none">Contatti</a>
      </nav>
    </div>
    <!-- Logo a sinistra, link nav a destra. Usa container + d-flex + justify-content-between -->
  </header>

  <section class="bg-light py-5">
    <div class="container text-center">
      <h2 class="fs-1 fw-bold mb-3">Saldi primavera</h2>
      <p class="fs-5 text-muted mb-4">Scopri le offerte sui prodotti in evidenza, fino al 50% di sconto.</p>
      <button class="border-0">
        <a href="" class=" d-inline-block bg-primary text-white text-decoration-none py-2 px-4 rounded">Vedi i prodotti</a>
      </button>
    </div>
    <!-- Hero: titolo grande, sottotitolo, bottone CTA. Usa container + text-center + classi utility -->
  </section>

  <main class="container my-4">
    <div class="row">

      <aside class="col-lg-3 d-none d-lg-block">
        <div class="bg-light p-3 rounded border">
          <h3 class="fs-5 fw-bold mb-3">Categorie</h3>
          <p class="m-0 mb-2">Scarpe</p>
          <p class="m-0 mb-2">T-Shirt</p>
          <p class="m-0 mb-2">Borse</p>
          <p class="m-0 mb-2">Accessore</p>
        </div>
        <!-- Sidebar categorie. Visibile solo da lg in su (d-none d-lg-block) -->
      </aside>

      <section class="col-12 col-lg-9">

        <h2 class="fs-3 fw-bold mb-4 text-center text-md-start">
          Prodotti in evidenza
        </h2>

        <!-- Riga che contiene le card -->
        <div class="row">

          <article class="col-12 col-md-6 col-xl-4 mb-3">
            <div class="border rounded p-3 bg-white shadow-sm">
              <div class="bg-secondary mb-2 rounded" style="height: 160px;"></div>
              <h3 class="fs-5 fw-bold m-0">Prodotto 1</h3>
              <p class="text-muted m-0">Prezzo</p>
            </div>
          </article>

          <article class="col-12 col-md-6 col-xl-4 mb-3">
            <div class="border rounded p-3 bg-white shadow-sm">
              <div class="bg-secondary mb-2 rounded" style="height: 160px;"></div>
              <h3 class="fs-5 fw-bold m-0">Prodotto 2</h3>
              <p class="text-muted m-0">Prezzo</p>
            </div>
          </article>

          <article class="col-12 col-md-6 col-xl-4 mb-3">
            <div class="border rounded p-3 bg-white shadow-sm">
              <div class="bg-secondary mb-2 rounded" style="height: 160px;"></div>
              <h3 class="fs-5 fw-bold m-0">Prodotto 3</h3>
              <p class="text-muted m-0">Prezzo</p>
            </div>
          </article>

        </div>

      </section>

    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
     <p class="m-0 small fw-semibold">
        &copy; 2026 EpiShop — tutti i diritti riservati
    </p>
    <!-- Footer scuro centrato con copyright -->
  </footer>

</body>

</html>
